<p class="note">시간·크기·위치 값은 미리보기용이며 게임 밸런스 수치가 아닙니다. 기존 검기 발산 캐릭터 시트는 횡베기 표현이 약한 시안이라는 한계가 있습니다. 좌우 반전은 캐릭터와 장비 전체를 반전합니다.</p>
