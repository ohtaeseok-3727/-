<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>미니 마법사 · 공격 동작 미리보기</title>
<style>
body{background:#202730;color:#eee;font:16px system-ui;margin:32px}main{display:flex;gap:24px;flex-wrap:wrap}section{background:#2d353e;padding:20px;border-radius:12px}canvas{max-width:100%;height:auto;image-rendering:pixelated}#reference{width:384px}#attack{width:768px}section{max-width:100%;box-sizing:border-box}button{padding:10px 18px;margin:8px 6px 8px 0;cursor:pointer}p{color:#bdc8d3}img{max-width:100%;image-rendering:pixelated}

<h1>미니 마법사 공격 동작</h1><p><a href="../combat-preview.html">기사·마법사 통합 미리보기 열기</a></p>
<label for="motion">공격 선택 </label><select id="motion" style="padding:10px;font:inherit"><option value="jab">1번 · 왼손 정권지르기 (7프레임)</option><option value="blade">2번 · 마력칼날 수평 휘두르기 (8프레임)</option><option value="push" selected>3번 · 양손 앞으로 뻗기 (8프레임)</option></select>

<main><section><h2>이동 시트 기준</h2><canvas id="reference" width="512" height="768"></canvas></section><section><h2 id="attack-title">공격 동작</h2><canvas id="attack" width="1024" height="768"></canvas></section></main>
