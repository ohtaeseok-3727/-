<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>천단참 — Blender 리메이크</title>
<style>body{margin:30px auto;max-width:1120px;background:#11151e;color:#e9e2ce;font:16px system-ui}canvas{width:100%;image-rendering:pixelated;border:1px solid #45402c}button,select,input{margin:12px 8px 12px 0;padding:8px;background:#292c35;color:#ffe4a7;border:1px solid #665936}p{color:#c5c1b5}a{color:#ffd276}</style>
<h1>천단참 · 금빛 단층</h1><p>검기 응축 → 굽은 참격과 잔상 → 사선 균열. Blender 렌더 기반 제작 미리보기이며 게임 캡처가 아닙니다.</p>
<canvas id="view" width="960" height="540"></canvas>
<button id="play">일시정지</button><button id="restart">처음부터</button><button id="flip">좌우 전환</button>
<select id="speed"><option value="1">정상 속도</option><option value="0.25">0.25배속</option><option value="0.5">0.5배속</option></select>
<input id="scrub" type="range" min="0" max="45" value="0"><span id="label"></span>
<p>균열 양쪽의 격자 변위는 미리보기 합성입니다. 실제 게임 연결·빌드·실행은 수행하지 않았습니다.</p>
<script>
const canvas=document.querySelector('#view'),ctx=canvas.getContext('2d'),atlas=new Image();
const slider=document.querySelector('#scrub'),label=document.querySelector('#label');
let playing=true,mirror=false,position=0,last=0;
atlas.src='cheondan-atlas.png';
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'일시정지':'재생'};
document.querySelector('#restart').onclick=()=>{position=0};
document.querySelector('#flip').onclick=()=>{mirror=!mirror};
slider.oninput=()=>{position=Number(slider.value);playing=false;document.querySelector('#play').textContent='재생'};
function paint(time){
 if(playing&&last)position=(position+Math.min(100,time-last)/1000*24*Number(document.querySelector('#speed').value))%60;
 last=time;const frame=Math.min(45,Math.floor(position));
 ctx.fillStyle='#181d28';ctx.fillRect(0,0,960,540);ctx.save();if(mirror){ctx.translate(960,0);ctx.scale(-1,1)}
 const separation=frame>=25&&frame<=42?12*Math.max(0,Math.min(1,(frame-24)/3,(43-frame)/5)):0;
 for(const side of [-1,1]){
 ctx.save();ctx.beginPath();
 if(side<0){ctx.moveTo(0,0);ctx.lineTo(-20,0);ctx.lineTo(980,540);ctx.lineTo(0,540)}
 else{ctx.moveTo(-20,0);ctx.lineTo(960,0);ctx.lineTo(960,540);ctx.lineTo(980,540)}
 ctx.closePath();ctx.clip();ctx.translate(side*separation,side*separation*.4);
 ctx.strokeStyle='#30394a';ctx.lineWidth=1;
 for(let x=-60;x<1040;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,540);ctx.stroke()}
 for(let y=-60;y<600;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(960,y);ctx.stroke()}
 ctx.fillStyle='#46516a';ctx.fillRect(160,310,150,200);ctx.fillRect(660,200,130,310);
 ctx.fillStyle='#b49963';for(let x of [180,240,680,740])for(let y of [330,390,450])ctx.fillRect(x,y,18,26);
 ctx.restore();}
 ctx.imageSmoothingEnabled=false;
 if(atlas.complete&&atlas.naturalWidth)ctx.drawImage(atlas,frame%8*320,Math.floor(frame/8)*180,320,180,0,0,960,540);
 ctx.restore();slider.value=frame;label.textContent=`${frame+1}/46 · ${frame<13?'응축':frame<22?'참격':frame<26?'잔상':'화면 균열'}`;
 requestAnimationFrame(paint);
}requestAnimationFrame(paint);
</script></html>
